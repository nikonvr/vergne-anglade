[project]
name = "certus-genealogy"
version = "0.1.0"
description = "Reconstruction généalogique autonome par IA."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "playwright>=1.40.0"
]

[project.optional-dependencies]
ocr = ["torch", "transformers", "Pillow"]
llm = ["openai"]
database = ["sqlalchemy>=2.0.0"]
genealogy = ["networkx>=3.0.0"]
api = ["fastapi>=0.110.0", "uvicorn[standard]>=0.28.0", "httpx>=0.27.0"]
dev = ["pytest", "ruff", "black", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]